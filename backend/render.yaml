services:
  - type: web
    name: queuesense-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false # You will provide this in the Render dashboard
      - key: FRONTEND_URL
        sync: false # You will provide this in the Render dashboard
